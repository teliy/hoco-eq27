name: Release

# Сборка подписанного APK и публикация релиза при пуше тега вида v1.2.3.
# Приложение проверяет именно релизы (GitHub Releases API), поэтому
# новый выпуск = новый тег + этот workflow.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build signed APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Rename APK
        if: startsWith(github.ref, 'refs/tags/')
        run: cp app/build/outputs/apk/release/app-release.apk "eq27-anc-${GITHUB_REF_NAME#v}.apk"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: eq27-anc-*.apk
          generate_release_notes: true
